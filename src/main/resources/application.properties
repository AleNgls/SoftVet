spring.application.name=backend

#dbUser= Veterinaria
#dbPass= contraVet

# Bbase de datos en MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria?createDatabaseIfNotExist=true&serverTimezone=UTC
#spring.datasource.username=Veterinaria
#spring.datasource.password=contraVet

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Jwt
jwt.secret.key=MiClaveSuperSecretaYBastanteLargaParaSpringSecurity12345
jwt.expiration.time=86400000

# Configuración de tamaño máximo para subir archivos
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB